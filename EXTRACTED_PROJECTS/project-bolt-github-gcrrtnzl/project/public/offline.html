<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>الأغبري — دون اتصال</title>
    <style>
      :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #0f172a; background: #f8fafc; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 480px); padding: 32px; border-radius: 24px; background: white; box-shadow: 0 12px 40px rgba(15,23,42,.08); text-align: center; }
      .mark { width: 56px; height: 56px; display: grid; place-items: center; margin: 0 auto 20px; border-radius: 18px; background: #0f172a; color: white; font-size: 28px; font-weight: 800; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0 0 24px; line-height: 1.8; color: #475569; }
      button { border: 0; border-radius: 12px; padding: 12px 18px; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">أ</div>
      <h1>أنت غير متصل</h1>
      <p>تعذر تحميل هذه الصفحة الآن. أعد الاتصال بالإنترنت ثم حاول مرة أخرى. لا يتم اعتماد الأسعار أو الطلبات الحساسة دون اتصال بالخادم.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
